<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>가즈아달력</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background-color: #f8f9fa;
            overflow: hidden;
        }

        #loading {
            text-align: center;
            font-size: 16px;
            color: #666;
            padding-top: 50px;
            font-weight: bold;
        }

        #calendar {
            max-width: 100%;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            background: #fff;
        }

        /* 이벤트 스타일 */
        .fc-event {
            cursor: pointer;
            padding: 3px 6px;
            background-color: #28a745 !important;
            border: none !important;
            border-radius: 6px;
            color: white !important;
            font-weight: bold;
            font-size: 12px;
        }

        .fc-event-title {
            color: white !important;
        }

        .fc-daygrid-event {
            white-space: normal !important;
        }

        /* 일요일 */
        .fc-day-sun a {
            color: #dc3545 !important;
        }

        /* 토요일 */
        .fc-day-sat a {
            color: #007bff !important;
        }

    </style>
</head>

<body>

<div id="loading">
    구글 시트 달력에서 일정을 읽어오는 중...
</div>

<div id="calendar" style="display:none;"></div>

<script>

    // ---------------- 설정 ----------------

    const SPREADSHEET_CSV_URL =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwyj8tc_nfUA8HM5XRbFJKxuV_QAGgZwYJjF4N553FDdToB8yBDU76vE2xHRFG0glJV3rtZE3GhuVC/pub?gid=1133141414&single=true&output=csv';

    const YEAR_MONTH = '2026-05';

    // -------------------------------------


    document.addEventListener('DOMContentLoaded', function () {

        fetchGridCSV();

    });


    // CSV 읽기
    async function fetchGridCSV() {

        try {

            const response = await fetch(SPREADSHEET_CSV_URL);

            if (!response.ok) {

                throw new Error('CSV 로딩 실패');

            }

            // UTF-8 한글 깨짐 방지
            const buffer = await response.arrayBuffer();

            const decoder = new TextDecoder('utf-8');

            const csvText = decoder.decode(buffer);

            console.log("===== CSV 원본 =====");
            console.log(csvText);

            Papa.parse(csvText, {

                header: false,

                skipEmptyLines: true,

                complete: function (results) {

                    console.log("===== 파싱 결과 =====");
                    console.log(results.data);

                    parseCalendarData(results.data);

                },

                error: function (err) {

                    console.error(err);

                    document.getElementById('loading').innerText =
                        'CSV 파싱 실패';

                }
            });

        } catch (err) {

            console.error(err);

            document.getElementById('loading').innerText =
                '구글 시트 연결 실패';

        }
    }



    // 달력 데이터 해석
    function parseCalendarData(rows) {

        const events = [];

        console.log("===== rows =====");
        console.log(rows);

        /*
            구조 예시

            1 2 3
              일정

            날짜 아래 줄에 일정이 있는 구조
        */

        for (let r = 0; r < rows.length - 1; r++) {

            const currentRow = rows[r];

            const nextRow = rows[r + 1];

            if (!currentRow) continue;

            for (let c = 0; c < currentRow.length; c++) {

                let dayNum = currentRow[c];

                if (!dayNum) continue;

                dayNum = dayNum.toString().trim();

                // 숫자만 추출
                dayNum = dayNum.replace(/[^0-9]/g, '');

                if (!dayNum) continue;

                let eventTitle = '';

                // 아래줄 일정 읽기
                if (nextRow && nextRow[c]) {

                    eventTitle = nextRow[c].toString().trim();

                }

                if (!eventTitle) continue;

                // 이상한 값 제거
                if (
                    eventTitle === 'null' ||
                    eventTitle === 'undefined' ||
                    eventTitle === '""'
                ) {
                    continue;
                }

                const dateString =
                    `${YEAR_MONTH}-${dayNum.padStart(2, '0')}`;

                events.push({

                    title: eventTitle,

                    start: dateString,

                    allDay: true

                });

            }
        }

        console.log("===== 최종 이벤트 =====");
        console.log(events);

        document.getElementById('loading').style.display = 'none';

        document.getElementById('calendar').style.display = 'block';

        initCalendar(events);

    }



    // 달력 생성
    function initCalendar(eventsData) {

        const calendarEl =
            document.getElementById('calendar');

        const calendar =
            new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',

                initialDate: `${YEAR_MONTH}-01`,

                locale: 'ko',

                height: '100%',

                dayMaxEventRows: true,

                displayEventTime: false,

                headerToolbar: {

                    left: 'prev,next today',

                    center: 'title',

                    right: ''

                },

                events: eventsData,

                eventClick: function(info) {

                    Swal.fire({

                        title: '상세 일정',

                        text: info.event.title,

                        icon: 'info',

                        confirmButtonText: '확인',

                        confirmButtonColor: '#28a745'

                    });

                }

            });

        calendar.render();

    }

</script>

</body>
</html>
