<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>일정 달력</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f8f9fa; overflow: hidden; }
        #loading { text-align: center; font-size: 13px; color: #666; padding-top: 50px; }
        #calendar { max-width: 100%; height: 100vh; padding: 2px; box-sizing: border-box; background: #fff; }
        
        /* 💡 모바일용 글씨 크기 및 여백 초소형 축소 스타일 */
        .fc { font-size: 10px !important; } /* 전체 달력 글씨 크기 대폭 축소 */
        .fc .fc-toolbar-title { font-size: 13px !important; font-weight: bold; } /* 상단 년/월 글씨 크기 */
        .fc .fc-button { padding: 2px 5px !important; font-size: 10px !important; } /* 버튼 크기 축소 */
        
        /* 일정 바(Bar) 촘촘하게 줄이기 */
        .fc-event { 
            cursor: pointer; 
            padding: 1px 3px !important; 
            font-size: 9px !important; 
            line-height: 1.1 !important;
            background-color: #28a745 !important; 
            border: none !important; 
            border-radius: 3px !important; 
            margin-bottom: 1px !important;
        }
        
        /* 날짜 칸 크기 및 숫자 조절 */
        .fc .fc-daygrid-day-top { flex-direction: row !important; justify-content: flex-start !important; padding: 1px !important; }
        .fc-day-sun a { color: #dc3545 !important; }
        .fc-day-sat a { color: #007bff !important; }
        
        /* 모바일에서 터치 스크롤 시 화면 밀림 방지 */
        .fc-scroller { overflow: hidden !important; }
    </style>
</head>
<body>

    <div id="loading">일정을 읽어오는 중...</div>
    <div id="calendar" style="display: none;"></div>

    <script>
        // ------------------ [ 마스터 설정 구역 ] ------------------
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwyj8tc_nfUA8HM5XRbFJKxuV_QAGgZwYJjF4N553FDdToB8yBDU76vE2xHRFG0glJV3rtZE3GhuVC/pub?gid=1133141414&single=true&output=csv';
        const YEAR_MONTH = '2026-05'; 
        // --------------------------------------------------------

        document.addEventListener('DOMContentLoaded', function() {
            fetchGridCSV();
        });

        async function fetchGridCSV() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL);
                if (!response.ok) throw new Error('네트워크 응답 에러');
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: false,
                    complete: function(results) {
                        parseCalendarData(results.data);
                    }
                });
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = '데이터 로드 실패';
            }
        }

        function parseCalendarData(rows) {
            const events = [];
            for (let r = 1; r < rows.length; r += 2) {
                const dateRow = rows[r];       
                const eventRow = rows[r + 1];  
                if (!dateRow) continue;
                
                for (let c = 0; c < 7; c++) {
                    let dayNum = dateRow[c] ? dateRow[c].toString().trim() : '';
                    dayNum = dayNum.replace(/[^0-9]/g, ''); 
                    
                    if (dayNum && eventRow && eventRow[c]) {
                        const eventTitle = eventRow[c].toString().trim();
                        if (eventTitle && eventTitle !== '""' && eventTitle !== 'null') {
                            const dateString = `${YEAR_MONTH}-${dayNum.padStart(2, '0')}`;
                            events.push({
                                title: eventTitle,
                                start: dateString,
                                allDay: true
                            });
                        }
                    }
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('calendar').style.display = 'block';
            initCalendar(events);
        }

        function initCalendar(eventsData) {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: `${YEAR_MONTH}-01`,
                locale: 'ko',
                height: 'parent',
                contentHeight: 'auto', // 모바일 세로 화면에 꽉 차게 조절
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                dayMaxEvents: 3, // 하루에 일정이 너무 많으면 모바일에서 '+더보기'로 깔끔하게 축소
                events: eventsData,
                eventClick: function(info) {
                    Swal.fire({
                        title: '상세 일정',
                        text: info.event.title,
                        icon: 'info',
                        confirmButtonText: '확인',
                        confirmButtonColor: '#28a745'
                    });
                }
            });
            
            calendar.render();
            
            setTimeout(() => {
                calendar.removeAllEvents();
                calendar.addEventSource(eventsData);
            }, 100);
        }
    </script>
</body>
</html>
