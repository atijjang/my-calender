<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>홀롤로로 숙제</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        #loading {
            text-align: center;
            padding-top: 40px;
            font-size: 18px;
            font-weight: bold;
            color: #666;
        }

        #calendar {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
            background: white;
        }

        .fc-event {
            background: #28a745 !important;
            border: none !important;
            color: white !important;
            font-weight: bold;
            border-radius: 6px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .fc-daygrid-event {
            white-space: normal !important;
        }

        .fc-day-sun a { color: #dc3545 !important; }
        .fc-day-sat a { color: #007bff !important; }

        @media (max-width: 768px) {
            .fc { font-size: 10px !important; }
            .fc-toolbar-title { font-size: 18px !important; }
            .fc .fc-button { padding: 4px 6px !important; font-size: 11px !important; }
            .fc-daygrid-day-number { font-size: 11px !important; }
            .fc-event { font-size: 9px !important; padding: 1px 3px !important; }
            .fc-event-title { font-size: 9px !important; }
            .fc-col-header-cell-cushion { font-size: 11px !important; }
            #calendar { padding: 4px !important; }
        }
    </style>
</head>

<body>

<div id="loading">구글 시트에서 일정 불러오는 중...</div>
<div id="calendar" style="display:none;"></div>

<script>

const SPREADSHEET_CSV_URL =
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwyj8tc_nfUA8HM5XRbFJKxuV_QAGgZwYJjF4N553FDdToB8yBDU76vE2xHRFG0glJV3rtZE3GhuVC/pub?gid=1133141414&single=true&output=csv';

const today = new Date();
const YEAR = today.getFullYear();
const MONTH = String(today.getMonth() + 1).padStart(2, '0');
const YEAR_MONTH = `${YEAR}-${MONTH}`;

document.addEventListener('DOMContentLoaded', loadCalendarData);

async function loadCalendarData() {

    try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        const buffer = await response.arrayBuffer();
        const decoder = new TextDecoder('utf-8');
        const csvText = decoder.decode(buffer);

        Papa.parse(csvText, {
            skipEmptyLines: true,
            complete: function(results) {
                parseCalendarData(results.data);
            }
        });

    } catch (err) {
        document.getElementById('loading').innerText = '구글 시트 연결 실패';
        console.error(err);
    }
}

function parseCalendarData(rows) {

    const events = [];

    for (let r = 0; r < rows.length - 1; r++) {

        const currentRow = rows[r];
        const nextRow = rows[r + 1];

        if (!currentRow) continue;

        for (let c = 0; c < currentRow.length; c++) {

            let dayNum = currentRow[c];
            if (!dayNum) continue;

            dayNum = dayNum.toString().trim().replace(/[^0-9]/g, '');
            if (!dayNum) continue;

            let eventTitle = '';

            if (nextRow && nextRow[c]) {
                eventTitle = nextRow[c].toString().trim();
            }

            if (!eventTitle) continue;

            if (['null', 'undefined', '""'].includes(eventTitle)) continue;

            const dateString = `${YEAR_MONTH}-${dayNum.padStart(2, '0')}`;

            events.push({
                title: eventTitle,
                start: dateString,
                allDay: true
            });
        }
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('calendar').style.display = 'block';

    initCalendar(events);
}

function initCalendar(eventsData) {

    const calendarEl = document.getElementById('calendar');

    const calendar = new FullCalendar.Calendar(calendarEl, {

        initialView: 'dayGridMonth',
        initialDate: `${YEAR_MONTH}-01`,
        locale: 'ko',
        contentHeight: 'auto',
        aspectRatio: 1.8,
        dayMaxEventRows: true,
        displayEventTime: false,

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: ''
        },

        events: eventsData,

        // ⭐ 핵심: ALT+ENTER 줄바꿈 처리
        eventContent: function(arg) {

            let title = arg.event.title || '';

            // \n 또는 실제 줄바꿈 모두 대응
            title = title.replace(/\n/g, '<br>');

            return {
                html: `<div style="white-space:normal; line-height:1.2;">${title}</div>`
            };
        },

        eventClick: function(info) {
            Swal.fire({
                title: '상세 일정',
                html: info.event.title.replace(/\n/g, '<br>'),
                icon: 'info',
                confirmButtonText: '확인',
                confirmButtonColor: '#28a745'
            });
        }

    });

    calendar.render();
}

</script>

</body>
</html>
