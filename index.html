<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>홀로로 숙제</title>

    <!-- FullCalendar -->
    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css"
        rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        #loading {
            text-align: center;
            padding-top: 40px;
            font-size: 18px;
            font-weight: bold;
            color: #666;
        }

        #calendar {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
            box-sizing: border-box;
            background: white;
        }

        /* 이벤트 */

        .fc-event {
            background: #28a745 !important;
            border: none !important;
            color: white !important;
            font-weight: bold;
            border-radius: 6px;
            padding: 2px 6px;
            cursor: pointer;
        }

        .fc-event-title {
            color: white !important;
        }

        .fc-daygrid-event {
            white-space: normal !important;
        }

        /* 일요일 */

        .fc-day-sun a {
            color: #dc3545 !important;
        }

        /* 토요일 */

        .fc-day-sat a {
            color: #007bff !important;
        }

    </style>
</head>

<body>

<div id="loading">
    구글 시트에서 일정 불러오는 중...
</div>

<div id="calendar" style="display:none;"></div>

<script>

    // ===========================
    // 설정
    // ===========================

    const SPREADSHEET_CSV_URL =
        'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwyj8tc_nfUA8HM5XRbFJKxuV_QAGgZwYJjF4N553FDdToB8yBDU76vE2xHRFG0glJV3rtZE3GhuVC/pub?gid=1133141414&single=true&output=csv';

    const today = new Date();
    const YEAR = today.getFullYear();
    const MONTH = String(today.getMonth() + 1).padStart(2, '0');
    const YEAR_MONTH = `${YEAR}-${MONTH}`;


    // ===========================
    // 시작
    // ===========================

    document.addEventListener('DOMContentLoaded', function () {

        loadCalendarData();

    });


    // ===========================
    // CSV 불러오기
    // ===========================

    async function loadCalendarData() {

        try {

            const response =
                await fetch(SPREADSHEET_CSV_URL);

            if (!response.ok) {

                throw new Error('CSV 로딩 실패');

            }

            // UTF-8 처리
            const buffer =
                await response.arrayBuffer();

            const decoder =
                new TextDecoder('utf-8');

            const csvText =
                decoder.decode(buffer);

            console.log('===== CSV 원본 =====');
            console.log(csvText);

            Papa.parse(csvText, {

                header: false,

                skipEmptyLines: true,

                complete: function(results) {

                    console.log('===== 파싱 결과 =====');
                    console.log(results.data);

                    parseCalendarData(results.data);

                },

                error: function(err) {

                    console.error(err);

                    document.getElementById('loading').innerText =
                        'CSV 파싱 실패';

                }

            });

        }
        catch(err) {

            console.error(err);

            document.getElementById('loading').innerText =
                '구글 시트 연결 실패';

        }

    }


    // ===========================
    // 달력 데이터 변환
    // ===========================

    function parseCalendarData(rows) {

        console.log('===== rows =====');
        console.log(rows);

        const events = [];

        /*
            구조 예시

            일 월 화 수 목 금 토
                1 2
                  근로자날

            날짜 아래 줄에 일정 존재
        */

        for (let r = 0; r < rows.length - 1; r++) {

            const currentRow = rows[r];

            const nextRow = rows[r + 1];

            if (!currentRow) continue;

            for (let c = 0; c < currentRow.length; c++) {

                let dayNum =
                    currentRow[c];

                if (!dayNum) continue;

                dayNum =
                    dayNum.toString().trim();

                // 숫자만 추출
                dayNum =
                    dayNum.replace(/[^0-9]/g, '');

                if (!dayNum) continue;

                let eventTitle = '';

                // 아래줄 일정 읽기
                if (
                    nextRow &&
                    nextRow[c]
                ) {

                    eventTitle =
                        nextRow[c]
                            .toString()
                            .trim();

                }

                if (!eventTitle) continue;

                // 이상값 제거
                if (
                    eventTitle === 'null' ||
                    eventTitle === 'undefined' ||
                    eventTitle === '""'
                ) {
                    continue;
                }

                const dateString =
                    `${YEAR_MONTH}-${dayNum.padStart(2, '0')}`;

                events.push({

                    title: eventTitle,

                    start: dateString,

                    allDay: true

                });

            }

        }

        console.log('===== 최종 이벤트 =====');
        console.log(events);

        // 로딩 제거
        document.getElementById('loading').style.display =
            'none';

        document.getElementById('calendar').style.display =
            'block';

        // 달력 생성
        initCalendar(events);

    }


    // ===========================
    // 달력 생성
    // ===========================

    function initCalendar(eventsData) {

        const calendarEl =
            document.getElementById('calendar');

        const calendar =
            new FullCalendar.Calendar(calendarEl, {

                initialView: 'dayGridMonth',

                initialDate: `${YEAR_MONTH}-01`,

                locale: 'ko',

                contentHeight: 'auto',

                aspectRatio: 1.8,

                dayMaxEventRows: true,

                displayEventTime: false,

                headerToolbar: {

                    left: 'prev,next today',

                    center: 'title',

                    right: ''

                },

                events: eventsData,

                eventClick: function(info) {

                    Swal.fire({

                        title: '상세 일정',

                        text: info.event.title,

                        icon: 'info',

                        confirmButtonText: '확인',

                        confirmButtonColor: '#28a745'

                    });

                }

            });

        calendar.render();

    }

</script>

</body>
</html>
