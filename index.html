<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일/카톡 최적화 달력</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    
    <style>
        /* 카톡 창 내부에서 여백 때문에 잘리지 않도록 전체 여백 최소화 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
            overflow: hidden; /* 전체 화면 스크롤 방지 */
        }
        #loading {
            text-align: center;
            font-size: 16px;
            color: #666;
            padding-top: 50px;
        }
        /* 카톡 창 높이에 맞춰 꽉 차게 조절 */
        #calendar {
            max-width: 100%;
            height: 100vh; /* 화면 높이 전체 사용 */
            padding: 10px;
            box-sizing: border-box;
            background: #fff;
        }
        /* 모바일 화면에서 글자가 너무 크면 잘리므로 폰트 조절 */
        .fc {
            font-size: 12px !important;
        }
        .fc-toolbar-title {
            font-size: 16px !important;
        }
        .fc-button {
            padding: 4px 8px !important;
            font-size: 12px !important;
        }
    </style>
</head>
<body>

    <div id="loading">일정을 읽어오는 중...</div>
    <div id="calendar" style="display: none;"></div>

    <script>
        // [기존 설정 유지]
        const API_KEY = 'YOUR_GOOGLE_API_KEY'; 
        const SHEET_ID = 'YOUR_SPREADSHEET_ID'; 
        const RANGE = 'Sheet1!A2:C100'; 

        document.addEventListener('DOMContentLoaded', function() {
            fetchRealtimeData();
        });

        function fetchRealtimeData() {
            const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQocsx7-SzulKQKxNkET4oOszVyAMNmOd1csc8dgiQLuLK8aTWDtUdhXVkGOJSRKb_k1hXlNdqthP4p/pub?output=csv'; 
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (!data.values) return;
                    const events = data.values.map(row => {
                        return { title: row[0], start: row[1], end: row[2] ? row[2] : null };
                    }).filter(event => event.start);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('calendar').style.display = 'block';
                    initCalendar(events);
                })
                .catch(error => { console.error(error); });
        }

        function initCalendar(eventsData) {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'ko',
                // 🔥 중요: 카톡 창 높이에 맞춰 달력 높이를 자동으로 맞추고 넘치면 스크롤바 생성
                height: 'parent', 
                contentHeight: 'auto',
                aspectRatio: 1.35,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listWeek' // 모바일에선 주 단위보다 목록(list)이 보기 편함
                },
                buttonText: { today: '오늘', month: '월', list: '목록' },
                events: eventsData,
                eventClick: function(info) {
                    alert('일정: ' + info.event.title);
                }
            });
            calendar.render();
        }
    </script>
</body>
</html>
