<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2층 구조 스마트 달력</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f8f9fa; overflow: hidden; }
        #loading { text-align: center; font-size: 16px; color: #666; padding-top: 50px; }
        #calendar { max-width: 100%; height: 100vh; padding: 10px; box-sizing: border-box; background: #fff; }
        .fc-event { cursor: pointer; padding: 2px 4px; background-color: #007bff; border: none; border-radius: 4px; }
        .fc-day-sun a { color: #dc3545 !important; }
        .fc-day-sat a { color: #007bff !important; }
    </style>
</head>
<body>

    <div id="loading">구글 시트 달력판에서 일정을 읽어오는 중...</div>
    <div id="calendar" style="display: none;"></div>

    <script>
        // ------------------ [ 설정 구역 ] ------------------
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRwyj8tc_nfUA8HM5XRbFJKxuV_QAGgZwYJjF4N553FDdToB8yBDU76vE2xHRFG0glJV3rtZE3GhuVC/pub?gid=1133141414&single=true&output=csv';
        const YEAR_MONTH = '2026-05'; // 현재 작성 중인 달력의 연도-월
        // --------------------------------------------------

        document.addEventListener('DOMContentLoaded', function() {
            if(SPREADSHEET_CSV_URL.includes('여기에')) {
                document.getElementById('loading').innerText = '오류: CSV 주소를 입력해주세요.';
                return;
            }
            fetchGridCSV();
        });

        function fetchGridCSV() {
            Papa.parse(SPREADSHEET_CSV_URL, {
                download: true,
                header: false,
                complete: function(results) {
                    const rows = results.data;
                    const events = [];
                    
                    // 요일 행(1행 = 인덱스 0) 건너뛰고, 2행(인덱스 1)부터 시작
                    // r은 2칸씩 점프합니다 (날짜행 -> 일정행)
                    for (let r = 1; r < rows.length; r += 2) {
                        const dateRow = rows[r];       // 예: 2행 (날짜가 적힌 행)
                        const eventRow = rows[r + 1];  // 예: 3행 (일정이 적힌 행)
                        
                        if (!dateRow) continue;
                        
                        // 일(0)부터 토(6)까지 7개 열 검사
                        for (let c = 0; c < 7; c++) {
                            const dayNum = dateRow[c] ? dateRow[c].trim() : '';
                            
                            // 날짜 숫자가 있고, 그 아래 칸에 일정 내용이 있다면
                            if (dayNum && eventRow && eventRow[c]) {
                                const eventTitle = eventRow[c].trim();
                                
                                if (eventTitle) {
                                    // 날짜를 YYYY-MM-DD 형태로 변환 (예: 2026-05-01)
                                    const dateString = `${YEAR_MONTH}-${String(dayNum).padStart(2, '0')}`;
                                    
                                    events.push({
                                        title: eventTitle,
                                        start: dateString,
                                        allDay: true
                                    });
                                }
                            }
                        }
                    }

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('calendar').style.display = 'block';
                    initCalendar(events);
                }
            });
        }

        function initCalendar(eventsData) {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: `${YEAR_MONTH}-01`,
                locale: 'ko',
                height: 'parent',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                events: eventsData,
                eventClick: function(info) {
                    Swal.fire({
                        title: '일정 확인',
                        text: info.event.title,
                        icon: 'info'
                    });
                }
            });
            calendar.render();
        }
    </script>
</body>
</html>
